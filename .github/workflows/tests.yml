name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./pipeline requests ijson pyarrow duckdb jinja2 openpyxl pytest pyyaml
      - name: Tests
        run: pytest pipeline/tests -q

  validate-corrections:
    # The corrections file is hand-edited when a dispute arrives, and a malformed
    # record fails the monthly site build. Catching that here means a typo is
    # caught on commit rather than at 12:00 UTC on the 15th.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corrections.json and the issue templates
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import json, pathlib, sys, yaml
          sys.path.insert(0, "pipeline")
          from gnw.corrections import load_corrections
          load_corrections(pathlib.Path("."))
          for f in pathlib.Path(".github/ISSUE_TEMPLATE").glob("*.yml"):
              yaml.safe_load(f.read_text())
              print("ok", f)
          print("corrections and issue templates valid")
          PY
