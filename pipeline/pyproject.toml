[project]
name = "gnw"
version = "0.1.0"
description = "Ghost Network Watch pipeline: crawl, parse, flag, score CMS QHP provider directories"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "ijson>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gnw"]
